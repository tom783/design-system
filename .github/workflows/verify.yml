# 같은 저장소의 PR은 push 실행이 커밋을 이미 검증하므로 pull_request 실행을 건너뛴다.
# 포크 PR은 base 저장소에 push 이벤트가 없으므로 pull_request 실행이 맡는다.
# 이렇게 해야 main·PR·PR 없는 작업 브랜치를 모두 검사하면서 같은 커밋을 두 번 돌리지 않는다.
name: verify

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# 작업 브랜치는 최신 커밋만 의미가 있다. main은 모든 sha가 판정을 받아야 하므로 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref_name != github.event.repository.default_branch }}

env:
  PLAYWRIGHT_VERSION: 1.65.1

jobs:
  gate:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # 임시 상향(20→45분). 마지막 녹색 실행이 13.5~14.8분이었고 그 뒤 하네스가 10개 넘게
    # 늘어 로컬 pnpm gate 가 약 25분이다. 샤딩·병렬화는 후속 작업에서 줄인다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # 범위(engines ">=22")를 넘기면 해석이 모호해서 명시한다. 로컬과 같은 메이저.
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 브라우저 바이너리만 실행 사이에 재사용한다. 빌드 산출물은 캐시하지 않는다(R8).
      - name: Playwright 브라우저 캐시
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      # GUI Chrome 을 쓰지 않는다 — 이유는 AGENTS.md "이미 밟은 함정" 참고.
      # chromium 전체가 아니라 headless shell 만 받는다.
      - run: npx --yes playwright@${PLAYWRIGHT_VERSION} install --with-deps chromium-headless-shell

      # Ubuntu 23.10+ 는 AppArmor 로 비특권 user namespace 를 막는다.
      # 그러면 Chromium 의 zygote 샌드박스가 초기화에 실패하고
      # "No usable sandbox!" 로 죽는다 (실제로 첫 CI 에서 그랬다).
      #
      # --no-sandbox 로 끄지 않는다. Chromium 공식 문서가 안내하는 대로
      # 커널 제한만 푼다 — 샌드박스는 켜진 채로 둔다.
      # 러너는 일회용이고 우리가 띄우는 것은 로컬 스토리북뿐이지만,
      # 보호를 끄는 것과 못 쓰게 막힌 것을 푸는 것은 다르다.
      - name: Chromium user namespace 허용 (샌드박스는 유지)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          else
            echo "제한 파일이 없습니다 — 그대로 진행합니다."
          fi

      - run: pnpm gate

      # 실패했을 때 화면을 볼 수 없으므로 스크린샷을 남긴다.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qa-shots
          path: .qa-shots/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
