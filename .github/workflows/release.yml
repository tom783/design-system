# 배포 워크플로 — **자동으로 돌지 않는다.**
#
# 보호가 네 겹이다. 네 개를 전부 통과해야 패키지가 나간다:
#   1) 트리거가 workflow_dispatch 뿐이다. push·tag·PR 로는 절대 실행되지 않는다
#   2) confirm 입력란에 정확히 "publish" 를 쳐야 한다 (기본값은 비어 있다)
#   3) environment: npm-publish 의 필수 검토자 승인 — 사람이 눌러야 진행된다
#   4) 각 패키지의 prepublishOnly 가 S2LIFE_PUBLISH=1 을 요구한다
# 게다가 기본값이 dry-run: true 라, 끄지 않으면 올리지 않고 확인만 한다.
#
# ── 인증: 토큰 없이 간다 (npm Trusted Publishing / OIDC) ──
# npmjs.com 의 각 패키지 설정에 이 저장소와 이 워크플로 파일명을 신뢰 게시자로
# 등록하면 장기 토큰이 필요 없다. 유출·만료·회전 대상이 사라진다.
# 요건: npm ≥ 11.5.1 · Node ≥ 22.14 · 아래 id-token: write.
#
# 신뢰 게시자를 등록하지 않았다면 secrets.NPM_TOKEN 으로도 동작한다(폴백).
# 둘 다 없으면 배포 단계에서 인증 실패로 멈춘다 — 조용히 넘어가지 않는다.
name: release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '배포하려면 publish 라고 입력하세요'
        required: true
        default: ''
      dry-run:
        description: '실제로 올리지 않고 확인만'
        type: boolean
        default: true

# OIDC 토큰 발급에 필요하다. 이게 없으면 신뢰 게시도 --provenance 도 실패한다.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # pnpm gate 는 약 7분(2026-11-23 측정) — release dry-run 45083044229에서 6분 52초였다.
    # 설치·게시 단계까지 감안한 60분 제한은 실제 게시 중 중단되지 않게 둔 여유다.
    timeout-minutes: 60
    # 필수 검토자를 걸어두면 여기서 사람 승인을 기다린다.
    # Settings → Environments → npm-publish → Required reviewers
    environment: npm-publish
    steps:
      - name: 확인 문구 검사
        if: inputs.confirm != 'publish'
        run: |
          echo "::error::confirm 입력이 'publish' 가 아닙니다. 중단합니다."
          exit 1

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: npm 버전 확인 (신뢰 게시 요건 11.5.1+)
        run: |
          echo "npm $(npm -v) · node $(node -v)"
          V="$(npm -v)" node -e "
            const [a, b, c] = process.env.V.split('.').map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error('npm 11.5.1 이상이 필요합니다 (신뢰 게시 요건). 현재 ' + process.env.V);
              process.exit(1);
            }
          "

      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium-headless-shell

      # verify.yml 과 같은 이유 — Ubuntu 의 user namespace 제한만 푼다.
      # --no-sandbox 로 끄지 않는다. 자세한 이유는 AGENTS.md 참고.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi

      # 배포 전에 전체 게이트를 통과해야 한다. 배포 리허설도 여기 포함된다.
      - run: pnpm gate

      - name: 버전 일치 확인 (lockstep)
        run: |
          node -e "
            const v = ['tokens','ui','mcp'].map(p => require('./packages/'+p+'/package.json').version);
            if (new Set(v).size !== 1) { console.error('버전 불일치: ' + v.join(' / ')); process.exit(1); }
            console.log('버전 ' + v[0] + ' 로 일치');
          "

      # 실제 게시 중 뒤 패키지에서 실패하면 앞 패키지는 되돌릴 수 없다. 세 패키지를 먼저
      # 포장해 npm의 자동 수정 경고와 패키지 자체 실패를 모두 확인한 뒤에만 게시한다.
      - name: 게시 전 점검
        env:
          # 실제 배포와 같은 인증·보호 환경에서 prepublishOnly까지 확인한다.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          S2LIFE_PUBLISH: '1'
          DRY: ${{ inputs.dry-run }}
        run: bash .github/scripts/publish-preflight.sh

      - name: 배포
        # dry-run은 바로 앞 점검이 같은 명령을 이미 실행했다. 실제 게시일 때만 다시 돈다.
        if: inputs.dry-run == false
        env:
          # 신뢰 게시자를 등록했다면 비어 있어도 된다 — OIDC 로 인증한다.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          S2LIFE_PUBLISH: '1'
          DRY: ${{ inputs.dry-run }}
        run: |
          FLAG=""
          if [ "$DRY" = "true" ]; then
            FLAG="--dry-run"
            echo "::notice::dry-run 입니다. 실제로 올리지 않습니다."
          fi
          # tokens → ui → mcp 순서. ui 가 tokens 를 참조하므로 먼저 올라가야 한다.
          for p in tokens ui mcp; do
            npm publish --workspace "packages/$p" --provenance $FLAG
          done
