# 검증 게이트. 로직은 전부 `pnpm gate` 안에 있고 그건 로컬에서 돌려 확인한 것이다
# (당시 147초, exit 0). 이 파일은 그걸 부르는 껍데기라 일부러 얇게 뒀다.
#
# pre-commit 은 빠른 것만(약 1.5초), pre-push 는 전체를 돌린다 — .githooks/ 참고.
# 여기는 --no-verify 로 건너뛴 푸시를 받아내는 마지막 그물이다.
name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    # 임시 상향(20→45분). 마지막 녹색 실행이 13.5~14.8분이었고 그 뒤 하네스가 10개 넘게
    # 늘어 로컬 pnpm gate 가 약 25분이다. 샤딩·병렬화는 후속 작업에서 줄인다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 범위(engines ">=22")를 넘기면 해석이 모호해서 명시한다. 로컬과 같은 메이저.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # GUI Chrome 을 쓰지 않는다 — 이유는 AGENTS.md "이미 밟은 함정" 참고.
      # chromium 전체가 아니라 headless shell 만 받는다.
      - run: npx playwright install --with-deps chromium-headless-shell

      # Ubuntu 23.10+ 는 AppArmor 로 비특권 user namespace 를 막는다.
      # 그러면 Chromium 의 zygote 샌드박스가 초기화에 실패하고
      # "No usable sandbox!" 로 죽는다 (실제로 첫 CI 에서 그랬다).
      #
      # --no-sandbox 로 끄지 않는다. Chromium 공식 문서가 안내하는 대로
      # 커널 제한만 푼다 — 샌드박스는 켜진 채로 둔다.
      # 러너는 일회용이고 우리가 띄우는 것은 로컬 스토리북뿐이지만,
      # 보호를 끄는 것과 못 쓰게 막힌 것을 푸는 것은 다르다.
      - name: Chromium user namespace 허용 (샌드박스는 유지)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          else
            echo "제한 파일이 없습니다 — 그대로 진행합니다."
          fi

      - run: pnpm gate

      # 실패했을 때 화면을 볼 수 없으므로 스크린샷을 남긴다.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-shots
          path: .qa-shots/
          retention-days: 7
          if-no-files-found: ignore
