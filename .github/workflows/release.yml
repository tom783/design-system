# 배포 워크플로 — **자동으로 돌지 않는다.**
#
# 트리거가 workflow_dispatch 뿐이라 push·tag·PR 로는 절대 실행되지 않는다.
# 실행하려면 사람이 Actions 탭에서 직접 눌러야 하고, 그때도 confirm 입력란에
# 정확히 "publish" 를 쳐야 한다. 거기에 더해 각 패키지의 prepublishOnly 가
# S2LIFE_PUBLISH=1 을 요구한다 — 의도적인 동작이 세 번 겹쳐야 나간다.
#
# 레지스트리는 npmjs.com 공개다(각 package.json 의 publishConfig).
# NPM_TOKEN 시크릿이 저장소에 등록돼 있어야 한다.
name: release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '배포하려면 publish 라고 입력하세요'
        required: true
        default: ''
      dry-run:
        description: '실제로 올리지 않고 확인만'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 확인 문구 검사
        if: inputs.confirm != 'publish'
        run: |
          echo "::error::confirm 입력이 'publish' 가 아닙니다. 중단합니다."
          exit 1

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium-headless-shell

      # 배포 전에 전체 게이트를 통과해야 한다. 배포 리허설도 여기 포함된다.
      - run: pnpm gate

      - name: 버전 일치 확인 (lockstep)
        run: |
          node -e "
            const v = ['tokens','ui','mcp'].map(p => require('./packages/'+p+'/package.json').version);
            if (new Set(v).size !== 1) { console.error('버전 불일치: ' + v.join(' / ')); process.exit(1); }
            console.log('버전 ' + v[0] + ' 로 일치');
          "

      - name: 배포
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          S2LIFE_PUBLISH: '1'
          DRY: ${{ inputs.dry-run }}
        run: |
          FLAG=""
          [ "$DRY" = "true" ] && FLAG="--dry-run" && echo "::notice::dry-run 입니다. 실제로 올리지 않습니다."
          for p in tokens ui mcp; do
            npm publish --workspace "packages/$p" --provenance $FLAG
          done
